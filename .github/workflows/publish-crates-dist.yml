name: Publish crates.io (dist)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-22.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish client-core
        run: cargo publish -p client-core --locked

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish nuwax-cli
        run: cargo publish -p nuwax-cli --locked
