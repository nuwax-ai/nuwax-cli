# 同步 GitHub Release 到阿里云 OSS
# 从已有的 GitHub Release 下载资产并上传到 OSS
# 触发方式: workflow_dispatch 手动选择要同步的标签

name: Sync Release to OSS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.0.0 or dev1.0.83)"
        required: true
        type: string

permissions:
  contents: read

env:
  OSS_ENDPOINT: "https://oss-rg-china-mainland.aliyuncs.com"
  OSS_REGION: "rg-china-mainland"
  OSS_BUCKET: "oss://nuwa-packages"
  OSS_CDN_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com"

jobs:
  sync-to-oss:
    name: Sync release assets to Alibaba Cloud OSS
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # latest/ 别名目录里的固定文件名，与 latest.json 的 platforms 键一一对应
      ALIAS_FILES: >-
        nuwax-cli-macos-arm64.tar.gz
        nuwax-cli-macos-amd64.tar.gz
        nuwax-cli-macos-universal.tar.gz
        nuwax-cli-linux-amd64.tar.gz
        nuwax-cli-linux-arm64.tar.gz
        nuwax-cli-windows-amd64.zip
        nuwax-cli-windows-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          mkdir -p release_assets
          echo "==> Downloading assets for tag: ${RELEASE_TAG}"
          gh release download "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --dir release_assets
          echo "==> Downloaded assets:"
          find release_assets -type f -ls

      - name: Install ossutil v2
        run: |
          curl -fSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Upload all release assets to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          VERSION="${RELEASE_TAG#v}"  # 去掉 v 前缀
          OSS_PREFIX="nuwax-cli/${RELEASE_TAG}"
          echo "==> Uploading to OSS: ${OSS_CDN_BASE}/${OSS_PREFIX}/"

          cd release_assets
          for file in *.tar.gz *.zip; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              ossutil cp --force "$file" "${OSS_BUCKET}/${OSS_PREFIX}/${file}" \
                --endpoint "$OSS_ENDPOINT" \
                --region "$OSS_REGION" \
                --access-key-id "$OSS_ACCESS_KEY_ID" \
                --access-key-secret "$OSS_ACCESS_KEY_SECRET"
              echo "✅ Uploaded: $file"
            fi
          done

      - name: Generate latest.json
        shell: bash
        run: |
          cd release_assets
          PLATFORMS="{}"

          gen_signature() {
            local file="$1"
            sha512sum "$file" | awk '{print $1}' | xxd -r -p | base64 -w0 2>/dev/null || base64
          }

          add_platform() {
            local key="$1"
            local filename="$2"
            if [ -f "$filename" ]; then
              local sig size url
              sig=$(gen_signature "$filename")
              size=$(stat -c%s "$filename" 2>/dev/null || stat -f%z "$filename")
              url="${OSS_CDN_BASE}/nuwax-cli/${RELEASE_TAG}/${filename}"
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg k "$key" \
                --arg u "$url" \
                --arg s "$sig" \
                --argjson sz "$size" \
                '. + {($k): {"url": $u, "signature": $s, "size": $sz}}')
              echo "  Added: $key -> $filename (${size} bytes)"
            fi
          }

          echo "==> Scanning release assets..."
          add_platform "darwin-aarch64"  "nuwax-cli-macos-arm64.tar.gz"
          add_platform "darwin-x86_64"  "nuwax-cli-macos-amd64.tar.gz"
          add_platform "darwin-universal" "nuwax-cli-macos-universal.tar.gz"
          add_platform "linux-x86_64"   "nuwax-cli-linux-amd64.tar.gz"
          add_platform "linux-aarch64"  "nuwax-cli-linux-arm64.tar.gz"
          add_platform "windows-x86_64"  "nuwax-cli-windows-amd64.zip"
          add_platform "windows-aarch64" "nuwax-cli-windows-arm64.zip"

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")
          LATEST_JSON=$(jq -n \
            --arg version "${RELEASE_TAG}" \
            --arg notes "Nuwax CLI ${RELEASE_TAG} release" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}')
          echo "$LATEST_JSON" > latest.json
          echo "==> Generated latest.json"
          cat latest.json | jq .

      - name: Upload latest.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # 上传到版本目录
          ossutil cp --force release_assets/latest.json "${OSS_BUCKET}/nuwax-cli/${RELEASE_TAG}/latest.json" \
            --endpoint "$OSS_ENDPOINT" \
            --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          echo "✅ Uploaded latest.json to ${RELEASE_TAG}/"

          # 根据版本类型更新对应的 latest 指针
          if [[ "$RELEASE_TAG" == v* ]]; then
            # 正式版本更新 stable 指针
            ossutil cp --force release_assets/latest.json "${OSS_BUCKET}/nuwax-cli/latest/latest.json" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
            echo "✅ Uploaded latest.json to latest/ (stable pointer)"
          elif [[ "$RELEASE_TAG" == dev* ]]; then
            # dev 版本更新 dev/latest.json
            ossutil cp --force release_assets/latest.json "${OSS_BUCKET}/nuwax-cli/dev/latest.json" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
            echo "✅ Uploaded latest.json to dev/ (dev pointer)"
          fi

      - name: Publish latest alias objects
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # 为 stable 通道生成固定文件名的别名对象（服务端复制，不重新上传），
          # 让安装脚本可以用不变化的 URL 拿到最新版，无需再手工维护版本号。
          # 必须先完成上面两步（产物 + latest.json 指针），别名才有资格落地。
          # 带预发布后缀的标签（v1.0.140-beta.1）也不落地，避免 beta 覆盖生产最新版。
          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == *-* ]]; then
            echo "==> Skipped: alias objects are only published for stable (v*, no prerelease) tags"
            exit 0
          fi

          cd release_assets
          # 只别名 latest.json 引用的安装用压缩包；*.npm.tar.gz 由 npm 按版本目录消费，不需要别名
          for file in $ALIAS_FILES; do
            # 该平台本次没有产出对应资产时跳过，交给 Verify 步骤判断是否成问题
            if [ ! -f "$file" ]; then
              echo "==> Skipped (not in this release): $file"
              continue
            fi
            echo "Aliasing: $file"
            ossutil cp --force \
              "${OSS_BUCKET}/nuwax-cli/${RELEASE_TAG}/${file}" \
              "${OSS_BUCKET}/nuwax-cli/latest/${file}" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
            echo "✅ Alias: nuwax-cli/latest/${file}"
          done

      - name: Verify OSS upload
        run: |
          # 根据版本类型验证不同的 URL
          if [[ "$RELEASE_TAG" == v* ]]; then
            VERIFY_URL="${OSS_CDN_BASE}/nuwax-cli/latest/latest.json"
          elif [[ "$RELEASE_TAG" == dev* ]]; then
            VERIFY_URL="${OSS_CDN_BASE}/nuwax-cli/dev/latest.json"
          else
            VERIFY_URL="${OSS_CDN_BASE}/nuwax-cli/${RELEASE_TAG}/latest.json"
          fi
          echo "==> Verifying: ${VERIFY_URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/oss-latest.json -w "%{http_code}" "$VERIFY_URL")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ latest.json verified (HTTP ${HTTP_STATUS})"
            cat /tmp/oss-latest.json | jq .
          else
            echo "❌ latest.json not found on OSS (HTTP ${HTTP_STATUS})"
            exit 1
          fi

          # 别名对象逐个确认：指针已发布却缺别名，安装脚本会 404
          if [[ "$RELEASE_TAG" == v* && "$RELEASE_TAG" != *-* ]]; then
            cd release_assets
            for file in $ALIAS_FILES; do
              if [ ! -f "$file" ]; then
                continue
              fi
              ALIAS_URL="${OSS_CDN_BASE}/nuwax-cli/latest/${file}"
              ALIAS_STATUS=$(curl -sS -o /dev/null -I -w "%{http_code}" "$ALIAS_URL")
              if [ "$ALIAS_STATUS" = "200" ]; then
                echo "✅ alias verified: ${file}"
              else
                echo "❌ alias missing (HTTP ${ALIAS_STATUS}): ${ALIAS_URL}"
                exit 1
              fi
            done
          fi
