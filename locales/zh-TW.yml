_version: 1

# CLI 命令和参数
cli:
  about: "Nuwax Cli ent - Docker 服務管理和升級工具"
  long_about: "一個自動化的 Docker 服務管理與升級平台客戶端，支援 Docker Compose 服務的集中管理、自動備份、智慧升級和運維監控"
  args:
    config: "設定檔路徑"
    verbose: "詳細輸出"
    lang: "語言設定 (zh-CN, zh-TW, en)"

  upgrade:
    help: "升級相關參數"
    force_help: "強制重新下載（用於檔案損壞時），會重新下載完整的服務包"
    check_help: "只檢查是否有可用的升級版本，不執行下載"

  auto_backup:
    help: "自動備份相關命令"
    run_help: "立即執行一次手動備份"
    status_help: "顯示備份狀態和歷史記錄"

  auto_upgrade_deploy:
    help: "自動升級部署相關命令"
    run_help: "立即執行自動升級部署"
    port_help: "指定frontend服務的通訊埠，對應docker-compose.yml中的FRONTEND_HOST_PORT變數（預設: 80通訊埠）"
    config_help: "指定自訂的docker-compose設定檔路徑（預設: docker/docker-compose.yml）"
    project_help: "指定docker-compose的專案名稱（預設: 從compose檔案讀取或使用'docker'）"
    status_help: "顯示目前自動升級設定"

  check_update:
    help: "客戶端更新相關命令"
    check_help: "檢查最新版本資訊"
    install_help: "安裝指定版本或最新版本"
    version_help: "指定版本號（如不指定則安裝最新版本）"
    force_help: "強制重新安裝（即使目前已是最新版本）"

  docker_service:
    help: "Docker服務相關命令"
    start_help: "啟動Docker服務"
    stop_help: "停止Docker服務"
    restart_help: "重新啟動Docker服務"
    status_help: "檢查服務狀態"
    restart_container_help: "重新啟動指定容器"
    load_images_help: "載入Docker映像"
    setup_tags_help: "設定映像標籤"
    arch_info_help: "顯示架構資訊"
    list_images_help: "列出Docker映像（使用ducker）"
    check_mount_dirs_help: "檢查並建立docker-compose.yml中的掛載目錄"

  cache:
    help: "快取管理相關命令"
    clear_help: "清理所有快取檔案"
    status_help: "顯示快取使用情況"
    clean_downloads_help: "清理下載快取（保留最新版本）"
    keep_help: "保留的版本數量"

  commands:
    status: "顯示服務狀態和版本資訊"
    init: "首次使用時初始化客戶端，建立設定檔和資料庫"
    init_force: "如果設定檔已存在，強制覆蓋"
    check_update: "檢查客戶端更新"
    api_info: "顯示目前API設定資訊"
    upgrade: "下載Docker服務檔案"
    list_backups: "列出所有備份"
    rollback: "從備份還原"
    rollback_backup_id: "備份 ID（可選，不提供時將顯示互動式選擇介面）"
    rollback_force: "強制覆蓋"
    rollback_list_json: "輸出 JSON 格式的備份列表（用於 GUI 整合）"
    rollback_data: "是否回溯資料檔案，預設不回溯"
    docker_service: "Docker服務相關命令"
    ducker: "一個用於管理 Docker 容器的終端機應用程式"
    ducker_help: "傳遞給ducker的參數"
    auto_backup: "自動備份管理"
    auto_upgrade_deploy: "自動升級部署"
    cache: "快取管理"
    diff_sql: "對比兩個SQL檔案並產生差異SQL"
    diff_sql_old: "舊版本SQL檔案路徑"
    diff_sql_new: "新版本SQL檔案路徑"
    diff_sql_old_version: "舊版本號，用於產生差異描述"
    diff_sql_new_version: "新版本號，用於產生差異描述"
