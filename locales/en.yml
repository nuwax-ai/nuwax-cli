_version: 1

# CLI commands and arguments
cli:
  about: "Nuwax Cli ent - Docker service management and upgrade tool"
  long_about: "An automated Docker service management and upgrade platform client, supporting centralized management, automatic backup, intelligent upgrade and operation monitoring of Docker Compose services"
  args:
    config: "Configuration file path"
    verbose: "Verbose output"
    lang: "Language setting (zh-CN, zh-TW, en)"

  upgrade:
    help: "Upgrade related parameters"
    force_help: "Force re-download (for corrupted files), will download the complete service package"
    check_help: "Only check for available upgrade versions, do not download"

  auto_backup:
    help: "Auto backup related commands"
    run_help: "Execute a manual backup immediately"
    status_help: "Show backup status and history"

  auto_upgrade_deploy:
    help: "Auto upgrade deploy related commands"
    run_help: "Execute auto upgrade deploy immediately"
    port_help: "Specify frontend service port, corresponds to FRONTEND_HOST_PORT variable in docker-compose.yml (default: port 80)"
    config_help: "Specify custom docker-compose config file path (default: docker/docker-compose.yml)"
    project_help: "Specify docker-compose project name (default: read from compose file or use 'docker')"
    status_help: "Show current auto upgrade configuration"

  check_update:
    help: "Client update related commands"
    check_help: "Check latest version information"
    install_help: "Install specified version or latest version"
    version_help: "Specify version number (install latest if not specified)"
    force_help: "Force reinstall even if already latest version"

  docker_service:
    help: "Docker service related commands"
    start_help: "Start Docker services"
    stop_help: "Stop Docker services"
    restart_help: "Restart Docker services"
    status_help: "Check service status"
    restart_container_help: "Restart specified container"
    load_images_help: "Load Docker images"
    setup_tags_help: "Setup image tags"
    arch_info_help: "Show architecture information"
    list_images_help: "List Docker images (using ducker)"
    check_mount_dirs_help: "Check and create mount directories in docker-compose.yml"

  cache:
    help: "Cache management related commands"
    clear_help: "Clear all cache files"
    status_help: "Show cache usage"
    clean_downloads_help: "Clean download cache (keep latest versions)"
    keep_help: "Number of versions to keep"

  commands:
    status: "Show service status and version information"
    init: "Initialize client on first use, create configuration file and database"
    init_force: "Force overwrite if configuration file already exists"
    check_update: "Check client updates"
    api_info: "Show current API configuration"
    upgrade: "Download Docker service files"
    list_backups: "List all backups"
    rollback: "Restore from backup"
    rollback_backup_id: "Backup ID (optional, will show interactive selection if not provided)"
    rollback_force: "Force overwrite"
    rollback_list_json: "Output JSON format backup list (for GUI integration)"
    rollback_data: "Whether to rollback data files, default no"
    docker_service: "Docker service related commands"
    ducker: "A terminal application for managing Docker containers"
    ducker_help: "Arguments passed to ducker"
    auto_backup: "Auto backup management"
    auto_upgrade_deploy: "Auto upgrade deploy"
    cache: "Cache management"
    diff_sql: "Compare two SQL files and generate diff SQL"
    diff_sql_old: "Old version SQL file path"
    diff_sql_new: "New version SQL file path"
    diff_sql_old_version: "Old version number for diff description"
    diff_sql_new_version: "New version number for diff description"
    diff_sql_output: "Diff SQL output file name"

