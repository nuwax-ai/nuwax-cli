_version: 1

# CLI 命令和参数
cli:
  about: "Nuwax Cli ent - Docker 服务管理和升级工具"
  long_about: "一个自动化的 Docker 服务管理与升级平台客户端，支持 Docker Compose 服务的集中管理、自动备份、智能升级和运维监控"
  args:
    config: "配置文件路径"
    verbose: "详细输出"
    lang: "语言设置 (zh-CN, zh-TW, en)"

  upgrade:
    help: "升级相关参数"
    force_help: "强制重新下载（用于文件损坏时），会重新下载完整的服务包"
    check_help: "只检查是否有可用的升级版本，不执行下载"

  auto_backup:
    help: "自动备份相关命令"
    run_help: "立即执行一次手动备份"
    status_help: "显示备份状态和历史记录"

  auto_upgrade_deploy:
    help: "自动升级部署相关命令"
    run_help: "立即执行自动升级部署"
    port_help: "指定frontend服务的端口号，对应docker-compose.yml中的FRONTEND_HOST_PORT变量（默认: 80端口）"
    config_help: "指定自定义的docker-compose配置文件路径（默认: docker/docker-compose.yml）"
    project_help: "指定docker-compose的项目名称（默认: 从compose文件读取或使用'docker'）"
    status_help: "显示当前自动升级配置"

  check_update:
    help: "客户端更新相关命令"
    check_help: "检查最新版本信息"
    install_help: "安装指定版本或最新版本"
    version_help: "指定版本号（如不指定则安装最新版本）"
    force_help: "强制重新安装（即使当前已是最新版本）"

  docker_service:
    help: "Docker服务相关命令"
    start_help: "启动Docker服务"
    stop_help: "停止Docker服务"
    restart_help: "重启Docker服务"
    status_help: "检查服务状态"
    restart_container_help: "重启指定容器"
    load_images_help: "加载Docker镜像"
    setup_tags_help: "设置镜像标签"
    arch_info_help: "显示架构信息"
    list_images_help: "列出Docker镜像（使用ducker）"
    check_mount_dirs_help: "检查并创建docker-compose.yml中的挂载目录"

  cache:
    help: "缓存管理相关命令"
    clear_help: "清理所有缓存文件"
    status_help: "显示缓存使用情况"
    clean_downloads_help: "清理下载缓存（保留最新版本）"
    keep_help: "保留的版本数量"

  commands:
    status: "显示服务状态和版本信息"
    init: "首次使用时初始化客户端，创建配置文件和数据库"
    init_force: "如果配置文件已存在，强制覆盖"
    check_update: "检查客户端更新"
    api_info: "显示当前API配置信息"
    upgrade: "下载Docker服务文件"
    list_backups: "列出所有备份"
    rollback: "从备份恢复"
    rollback_backup_id: "备份 ID（可选，不提供时将显示交互式选择界面）"
    rollback_force: "强制覆盖"
    rollback_list_json: "输出 JSON 格式的备份列表（用于 GUI 集成）"
    rollback_data: "是否回滚数据文件，默认不回滚"
    docker_service: "Docker服务相关命令"
    ducker: "一个用于管理 Docker 容器的终端应用"
    ducker_help: "传递给ducker的参数"
    auto_backup: "自动备份管理"
    auto_upgrade_deploy: "自动升级部署"
    cache: "缓存管理"
    diff_sql: "对比两个SQL文件并生成差异SQL"
    diff_sql_old: "旧版本SQL文件路径"
    diff_sql_new: "新版本SQL文件路径"
    diff_sql_old_version: "旧版本号，用于生成差异描述"
    diff_sql_new_version: "新版本号，用于生成差异描述"
