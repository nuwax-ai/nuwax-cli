[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Build only the packages being released instead of `--workspace`.
precise-builds = true
# Keep existing hand-written workflows untouched.
allow-dirty = ["ci"]
# Additional publish jobs run by dist's generated CI.
# npm is built-in, crates.io is handled by our custom workflow below.
publish-jobs = ["npm", "./publish-crates-dist"]
