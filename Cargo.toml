[workspace]
resolver = "2"
members = ["client-core", "nuwax-cli"]


[workspace.dependencies]

# 集成的 ducker Docker TUI (锁定 v0.5.5 以兼容 bollard 0.19.4)
ducker = { version = "0.5.5"}

# 异步运行时
tokio = { version = "1.52", features = ["macros", "net", "rt", "rt-multi-thread"] }
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
log = "0.4"

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# 时间处理
chrono = { version = "0.4", features = ["serde", "now"] }

# Web框架
axum = { version = "0.8", features = [
    "http2",
    "query",
    "tracing",
    "ws",
    "multipart",
    "macros",
] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = [
    "compression-full",
    "cors",
    "fs",
    "trace",
] }
axum-extra = { version = "0.12", features = ["typed-header"] }

# API文档
utoipa = { version = "5.4", features = ["axum_extras", "chrono"] }
utoipa-rapidoc = { version = "6", features = ["axum"] }
utoipa-redoc = { version = "6", features = ["axum"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# 并发工具
dashmap = "6.1"
once_cell = "1.21"

# 测试
criterion = "0.8.2"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.33"
serde_with = "3.20"

# 配置文件
toml = "0.9"

# 构建工具
derive_builder = "0.20"

# HTTP客户端
reqwest = { version = "0.13", features = [
    "json",
    "rustls-no-provider",
], default-features = false }

# TLS 加密提供者 - 使用 ring 替代 aws-lc-rs，避免 Ubuntu 20.04 GCC 编译器兼容性问题
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

http = "1.3"

# 命令行工具
clap = { version = "4.6", features = ["derive", "env"] }

# UUID
uuid = { version = "1.23", features = ["v7"] }

# 数据库
# sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
duckdb = { version = "1.4.5", features = ["bundled", "chrono", "uuid", "json"] }

# 自更新 - 已移除，现在使用基于 GitHub API 的更新机制

# 系统工具
which = "8.0"

# 文件系统
tempfile = "3.27"
walkdir = "2.5"

# 压缩
zip = "8.6"
zip-extract = "0.4"
flate2 = "1.1"
tar = "0.4"

# 文件类型检测 (魔数检测)
infer = "0.19"

# 加密和哈希
sha2 = "0.11"

# 进度条
indicatif = "0.18"

# 消息传递 (用于DuckDB Actor模式)
tokio-stream = "0.1"

# SQL解析 依赖的库(nuwax fork of upstream sqlparser,支持 CREATE FULLTEXT/SPATIAL INDEX)
sqlparser = { package = "nuwax-sqlparser", version = "0.63.0" }
regex = "1.12"

# --- OSS Dependencies ---
# Note: 使用 aliyun-oss-rust-sdk 库，支持分片上传，解决大文件(>5GB)上传问题;另外: 当文件较大，建议使用 SDK 或者 ossutil 进行大文件下载。下载链接默认有效期 300s，大文件下载可能会失败，失败仍会产生流量费用
aliyun-oss-rust-sdk = "0.2.2"
url = "2.5"

# 版本号解析
winnow = "1.0"


# Docker API 客户端 (与 ducker v0.5.5 兼容)
bollard = "0.19.4"

# MySQL Async 客户端,用于连接mysql,执行差异sql,升级库表结构
mysql_async = "0.36.2"

docker-compose-types = "0.23"

# 解析.env 环境变量文件
dotenvy = "0.15"

# 国际化支持
rust-i18n = "4"

# 文件操作扩展
fs_extra = "1.3"
remove_dir_all = "1"

# Base64 编码/解码
base64 = "0.22"

# 系统信息
num_cpus = "1.16"

# Shell 变量展开
shellexpand = "3.1.0"

# 缓存库
quick_cache = "0.6"

# CLI 自更新
self-replace = "1.5.0"

# 错误处理 (美化输出)
color-eyre = "0.6"

# TUI 终端界面
ratatui = "0.30"

# 系统目录路径
dirs = "6.0"

# 解析器组合子
nom = "8"

# C FFI 绑定
libc = "0.2"

# Unix 系统调用
nix = { version = "0.30", features = ["user"] }

# 测试相关
tokio-test = "0.4"
memory-stats = "1.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
